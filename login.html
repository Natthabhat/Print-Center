<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}document.documentElement.dataset.theme=t==='dark'||t==='light'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script><title>Sign in · Print Center</title>
<style>
:root,:root[data-theme=light]{color-scheme:light;--accent:#0f52ba;--accent-fill:#0f52ba;--accent-strong:#0b3f91;--accent-soft:#0f52ba;--on-accent:#fff;--bg:#f4f5f7;--ink:#111;--panel:#fff;--c141414:#ededed;--c1e1e1e:#e4e4e4;--c3c3c3c:#c9c9c9;--c454545:#c1c1c1;--c8c8c8c:#818181;--ca1a1a1:#6e6e6e;--cb7b7b7:#5a5a5a;--cb9b9b9:#585858;--cf0f0f0:#272727;--cffb7a9:#801500}
:root[data-theme=dark]{color-scheme:dark;--accent:#5b8fea;--accent-fill:#0f52ba;--accent-strong:#3e74c9;--accent-soft:#b9cff5;--on-accent:#fff;--bg:#0b0b0b;--ink:#f0f0f0;--panel:#1a1a1a;--c141414:#141414;--c1e1e1e:#1e1e1e;--c3c3c3c:#3c3c3c;--c454545:#454545;--c8c8c8c:#8c8c8c;--ca1a1a1:#a1a1a1;--cb7b7b7:#b7b7b7;--cb9b9b9:#b9b9b9;--cf0f0f0:#f0f0f0;--cffb7a9:#ffb7a9}

:root{font-family:system-ui,sans-serif;color:var(--ink);background:var(--bg)}body{background:var(--bg)}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px);padding:36px;border:1px solid var(--c3c3c3c);border-radius:20px;background:var(--panel);box-shadow:0 24px 80px #0003}.mark{width:56px;height:56px;display:block;object-fit:contain}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--cb7b7b7);margin:16px 0 8px}h1{font-size:30px;margin:0 0 10px}p{font-size:14px;color:var(--cb9b9b9);line-height:1.6;margin-bottom:28px}label{display:block;font-size:14px;margin:18px 0 8px}input{width:100%;border:1px solid var(--c454545);border-radius:10px;padding:13px;background:var(--c141414);color:var(--cf0f0f0);font:inherit}input:focus{outline:2px solid var(--accent);outline-offset:2px}button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent-fill);color:var(--on-accent);font:600 15px system-ui;cursor:pointer;margin-top:26px}button:disabled{opacity:.6;cursor:wait}.error{color:var(--cffb7a9);font-size:14px;min-height:22px;margin:14px 0 0}.foot{text-align:center;font-size:12px;margin:24px 0 0;color:var(--c8c8c8c)}
.remember{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:20px}.remember input{width:17px;height:17px;margin:0;accent-color:var(--accent)}.rememberhint{font-size:11px;margin:8px 0 0 27px;color:var(--ca1a1a1)}.remember span{line-height:1.5}</style></head><body><main class="card"><img class="mark" src="/icons/logo-112.webp" alt="" width="56" height="56"><div class="eyebrow">YOUR WORKSHOP</div><h1>Print Center</h1><p>Sign in to monitor and manage your printers.</p><form id="login"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="128" autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><label class="remember"><input id="remember" name="remember" type="checkbox" checked><span>Keep me signed in for 30 days</span></label><p class="rememberhint">Use this option on your personal device.</p><div id="error" class="error" role="alert"></div><button id="submit" type="submit">Sign in</button></form><div class="foot">Your print room, together.</div></main>
<script>
document.getElementById('login').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;button.textContent='Signing in…';error.textContent='';try{const response=await fetch('/api/login',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json','X-Login-Token':'__LOGIN_TOKEN__'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value,remember:document.getElementById('remember').checked})});const value=await response.json();if(!response.ok)throw Error(value.error||'Could not sign in');const session=await fetch('/api/printers',{credentials:'same-origin',cache:'no-store'});if(session.status===401)throw Error('Your browser did not keep the sign-in cookie. Allow cookies for printer.natthabhat.com, then try again.');if(!session.ok)throw Error('Could not verify your session. Please try again.');location.replace('/')}catch(e){error.textContent=e.message;button.disabled=false;button.textContent='Sign in'}};
</script></body></html>
