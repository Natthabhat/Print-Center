<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Print Center</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#eef2e9;background:#101512}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px);padding:36px;border:1px solid #343f35;border-radius:20px;background:#19201b;box-shadow:0 24px 80px #0003}.mark{color:#cbef83;font-size:28px}.eyebrow{font-size:11px;letter-spacing:2px;color:#aebbaa;margin:16px 0 8px}h1{font-size:30px;margin:0 0 10px}p{font-size:14px;color:#b0bdae;line-height:1.6;margin-bottom:28px}label{display:block;font-size:14px;margin:18px 0 8px}input{width:100%;border:1px solid #3c483e;border-radius:10px;padding:13px;background:#101612;color:#eef2e9;font:inherit}input:focus{outline:2px solid #cbef83;outline-offset:2px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#cbef83;color:#182116;font:600 15px system-ui;cursor:pointer;margin-top:26px}button:disabled{opacity:.6;cursor:wait}.error{color:#ffb7a9;font-size:14px;min-height:22px;margin:14px 0 0}.foot{text-align:center;font-size:12px;margin:24px 0 0;color:#81917f}
</style></head><body><main class="card"><div class="mark" aria-hidden="true">◈</div><div class="eyebrow">YOUR WORKSHOP</div><h1>Print Center</h1><p>Sign in to monitor and manage your printers.</p><form id="login"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="128" autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><div id="error" class="error" role="alert"></div><button id="submit" type="submit">Sign in</button></form><div class="foot">Your print room, together.</div></main>
<script>
document.getElementById('login').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;button.textContent='Signing in…';error.textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Login-Token':'__LOGIN_TOKEN__'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const value=await response.json();if(!response.ok)throw Error(value.error||'Could not sign in');location.replace('/')}catch(e){error.textContent=e.message;button.disabled=false;button.textContent='Sign in'}};
</script></body></html>
